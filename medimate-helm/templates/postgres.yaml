apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-statefulset
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-db # 0. must match
  serviceName: {{ .Release.Name }}-database-service # 3.
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-db # 0.
    spec:
      containers:
      - name: postgres # container name
        image: {{ .Values.database.image.repository }}
        ports:
        - containerPort: {{ .Values.database.image.container_port }}
          name: postgres # optional
        env:  
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-configmap
              key: {{ .Values.configMap.value.db_name }}
        - name: POSTGRES_USER # must be exactly like this
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secret
              key: {{ .Values.secrets.values.db_username }}
        - name: POSTGRES_PASSWORD # must be exactly like this
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secret
              key: {{ .Values.secrets.values.db_password }}
        volumeMounts:
        - name: postgres-volume # 1. must match metadata.name in volumeClaimTemplates
          mountPath: {{ .Values.database.volume.mountPath }} # standard mount path for postgres 17 and below
  volumeClaimTemplates:
  - metadata:
      name: postgres-volume # 1.
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.database.volume.storage | default "1Gi" }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-database-service # 3. must match
spec:
  clusterIP: {{ .Values.database.service.clusterIP }}
  selector:
    app: {{ .Release.Name }}-db # 0.
  ports:
  - port: {{ .Values.database.service.port }} # can be any port
    targetPort: {{ .Values.database.service.targetPort }} # must match container port